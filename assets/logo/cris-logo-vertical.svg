<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="crisNavyCyanV" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A2540" />
      <stop offset="50%" stop-color="#0E2B4C" />
      <stop offset="100%" stop-color="#0080A8" />
    </linearGradient>

    <linearGradient id="crisEcoGreenV" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0080A8" />
      <stop offset="45%" stop-color="#009E49" />
      <stop offset="100%" stop-color="#28A745" />
    </linearGradient>
  </defs>

  <!-- ISOTIPO CENTRADO ARRIBA -->
  <g transform="translate(100, 25) scale(0.95)">
